name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# The repository root IS the Next.js app (cognitive/).
# No working-directory override needed — all paths are relative to repo root.

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: ✓ lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

  # ── 2. Type-check ──────────────────────────────────────────────────────────
  typecheck:
    name: ✓ typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run typecheck

  # ── 3. Build ───────────────────────────────────────────────────────────────
  build:
    name: ✓ build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-out
          path: out
          retention-days: 1

  # ── 4. Unit tests ──────────────────────────────────────────────────────────
  unit:
    name: ✓ unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test -- --reporter=verbose

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 7

  # ── 5. Component tests ─────────────────────────────────────────────────────
  component:
    name: ✓ component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run component tests
        run: npm run test:component -- --reporter=verbose

  # ── 6. E2E (requires build) ───────────────────────────────────────────────
  e2e:
    name: ✓ e2e
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-out
          path: out

      - name: Start static file server
        run: npx serve out --listen 3000 &
        env:
          CI: true

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # ── 7. Accessibility ───────────────────────────────────────────────────────
  accessibility:
    name: ✓ accessibility
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-out
          path: out

      - name: Start static file server
        run: npx serve out --listen 3000 &
        env:
          CI: true

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run accessibility tests
        run: npm run test:a11y
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true

  # ── 8. Production smoke test ──────────────────────────────────────────────
  smoke:
    name: ✓ production smoke test
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-out
          path: out

      - name: Start static file server
        run: npx serve out --listen 3000 &
        env:
          CI: true

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run production smoke tests
        run: npx playwright test --project=smoke
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: true

      - name: Upload smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: playwright-report
          retention-days: 7

  # ── Required-checks gate ───────────────────────────────────────────────────
  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build, unit, component, e2e, accessibility, smoke]
    if: always()
    steps:
      - name: Check all jobs
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          BUILD: ${{ needs.build.result }}
          UNIT: ${{ needs.unit.result }}
          COMPONENT: ${{ needs.component.result }}
          E2E: ${{ needs.e2e.result }}
          A11Y: ${{ needs.accessibility.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          failed=""
          [ "$LINT"      != "success" ] && failed="$failed lint"
          [ "$TYPECHECK" != "success" ] && failed="$failed typecheck"
          [ "$BUILD"     != "success" ] && failed="$failed build"
          [ "$UNIT"      != "success" ] && failed="$failed unit"
          [ "$COMPONENT" != "success" ] && failed="$failed component"
          [ "$E2E"       != "success" ] && failed="$failed e2e"
          [ "$A11Y"      != "success" ] && failed="$failed accessibility"
          [ "$SMOKE"     != "success" ] && failed="$failed smoke"
          if [ -n "$failed" ]; then
            echo "Failed checks:$failed"
            exit 1
          fi
          echo "All checks passed."
